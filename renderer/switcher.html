<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- 'self' is unusable on file:// pages (opaque origin), so scheme sources it is -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; img-src file: data:; font-src file:">
  <title>Switcher</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="switcher.css">
</head>
<body>
  <div id="root">
    <div class="scrim" id="scrim"></div>
    <div class="layer">
      <div class="panel" id="panel">
        <div class="cards" id="cards"></div>
        <div class="hints">
          <span><span class="key">Tab</span> Next</span>
          <span><span class="keys"><span class="key">Shift</span><span class="key">Tab</span></span> Back</span>
          <span><span class="key">W</span> Close window</span>
          <span><span class="key">Esc</span> Cancel</span>
        </div>
      </div>
    </div>
  </div>
  <script src="switcher.js"></script>
</body>
</html>
