<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Home's backdrop alone, rendered off screen into the desktop wallpaper (main.js), so
       what shows behind windows is the same surface Home sits on. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'">
  <title>Backdrop</title>
  <link rel="stylesheet" href="tokens.css">
  <style>html, body { margin: 0; height: 100%; overflow: hidden; } canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
  <canvas id="backdrop"></canvas>
  <script src="backdrop.js"></script>
</body>
</html>
