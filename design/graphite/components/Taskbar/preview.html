<!-- @dsCard group="Shell" height=120 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Taskbar</title>
<style>
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 40%,var(--backdrop-glow),var(--backdrop) 70%);font-family:var(--font-sans);color:var(--ink);box-sizing:border-box}
.card{background:linear-gradient(180deg,var(--surface-200),var(--surface-100));border:1px solid var(--glass-edge);border-radius:var(--radius-md);box-shadow:var(--shadow-card),inset 0 1px 0 var(--glass-sheen);overflow:hidden;color:var(--ink)}
.strip{display:flex;align-items:center;gap:var(--space-2);height:var(--strip-height);padding:0 var(--space-10);background:var(--header);border-bottom:1px solid var(--line);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-muted);box-sizing:border-box}
.strip .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glyph{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ghost{font:inherit;font-size:13px;line-height:18px;font-weight:500;color:var(--ink);background:none;border:0;border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);cursor:pointer}
.ghost:hover,.ghost.hover{background:var(--surface-300)}
.hint{font-size:11px;line-height:14px;color:var(--ink-muted);display:flex;align-items:center;gap:var(--space-1)}
kbd{font-family:var(--font-sans);font-size:11px;color:var(--ink-muted)}
body{display:flex;align-items:flex-end;justify-content:center;padding:var(--space-2)}
.bar{display:flex;align-items:center;gap:var(--space-1);height:var(--taskbar-height);padding:0 var(--space-2);width:100%;max-width:720px;box-sizing:border-box;background:var(--surface-200);border:1px solid var(--glass-edge);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-muted)}
.item{position:relative;display:flex;align-items:center;gap:var(--space-2);height:36px;padding:0 var(--space-3);border-radius:var(--radius-sm);white-space:nowrap}
.item.on{background:var(--surface-300);color:var(--ink)}
.app{width:20px;height:20px;border-radius:5px;background:var(--surface-300);border:1px solid var(--glass-edge);flex:none}
.item.on .app{background:var(--surface-100)}
.dot{position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:var(--radius-full);background:var(--accent)}
.apps{flex:1;display:flex;justify-content:center;gap:var(--space-1);min-width:0;overflow:hidden}
.tray{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-2);white-space:nowrap}
.time{color:var(--ink);text-align:right}
@media (max-width:520px){.label{display:none}}
</style></head><body>
<div class="bar">
<div class="item"><svg class="glyph" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></div>
<div class="apps">
<div class="item on"><span class="app"></span><span class="label">Terminal</span></div>
<div class="item"><span class="app"></span><span class="label">Files</span></div>
<div class="item"><span class="app"></span><span class="label">Rider</span><span class="dot"></span></div>
</div>
<div class="tray">
<svg class="glyph" viewBox="0 0 16 16"><path d="M2 6.5a9 9 0 0 1 12 0M4 9a6 6 0 0 1 8 0M6 11.3a3 3 0 0 1 4 0"/></svg>
<svg class="glyph" viewBox="0 0 16 16"><path d="M3 6h2.5L9 3v10L5.5 10H3zM11.5 6a3 3 0 0 1 0 4"/></svg>
<span class="time">14:32<br>16/10/2026</span>
</div>
</div>
</body></html>
