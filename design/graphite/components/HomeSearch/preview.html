<!-- @dsCard group="Shell" height=420 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>HomeSearch</title>
<style>
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 40%,var(--backdrop-glow),var(--backdrop) 70%);font-family:var(--font-sans);color:var(--ink);box-sizing:border-box;overflow:hidden}
.card{background:linear-gradient(180deg,var(--surface-200),var(--surface-100));border:1px solid var(--glass-edge);border-radius:var(--radius-md);box-shadow:var(--shadow-card),inset 0 1px 0 var(--glass-sheen);overflow:hidden;color:var(--ink)}
.strip{display:flex;align-items:center;gap:var(--space-2);height:var(--strip-height);padding:0 var(--space-10);background:var(--header);border-bottom:1px solid var(--line);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-muted);box-sizing:border-box}
.strip .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glyph{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ghost{font:inherit;font-size:13px;line-height:18px;font-weight:500;color:var(--ink);background:none;border:0;border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);cursor:pointer;transition:background var(--duration-instant) var(--ease-standard)}
.ghost:hover,.ghost.hover{background:var(--surface-300)}
.hint{font-size:11px;line-height:14px;color:var(--ink-muted);display:flex;align-items:center;gap:var(--space-1)}
kbd{font-family:var(--font-sans);font-size:11px;color:var(--ink-muted)}
.controls{position:fixed;left:var(--space-2);bottom:var(--space-2);display:flex;gap:var(--space-1);z-index:50}
.controls .ghost{font-size:12px;padding:6px var(--space-3);background:var(--surface-200);border:1px solid var(--glass-edge)}
.controls .ghost:hover{background:var(--surface-300)}
@keyframes rise-in{from{opacity:0;transform:translateY(var(--rise)) scale(var(--scale-from))}to{opacity:1;transform:none}}
@keyframes rise-out{from{opacity:1;transform:none}to{opacity:0;transform:scale(0.98)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@keyframes row-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
.field{width:100%;max-width:560px;display:flex;align-items:center;gap:var(--space-3);height:56px;padding:0 var(--space-6);box-sizing:border-box;background:linear-gradient(180deg,var(--surface-200),var(--surface-100));border:1px solid var(--glass-edge);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay),inset 0 1px 0 var(--glass-sheen);font-size:20px;line-height:28px;color:var(--ink-muted)}
.field .glyph{width:20px;height:20px}
.caret{display:inline-block;width:2px;height:24px;background:var(--accent);margin-right:2px;vertical-align:-5px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.recent{width:100%;max-width:560px;margin-top:var(--space-6);padding:0 var(--space-2);box-sizing:border-box}
.label{font-size:11px;line-height:14px;color:var(--ink-muted);padding:0 var(--space-4) var(--space-2)}
.row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);font-size:14px;line-height:22px;transition:background var(--duration-instant) var(--ease-standard)}
.row:hover{background:var(--surface-300)}
.row .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11px;line-height:14px;color:var(--ink-muted)}
.row .glyph{color:var(--ink-muted)}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;padding:56px var(--space-4) var(--space-4);box-sizing:border-box}
.keys{margin-top:auto;display:flex;gap:var(--space-6);flex-wrap:wrap;justify-content:center;padding-bottom:var(--space-6)}
.play .field{animation:rise-in var(--duration-slow) var(--ease-enter) both}
.play .label{animation:row-in var(--duration-base) var(--ease-enter) 120ms both}
.play .row{animation:row-in var(--duration-base) var(--ease-enter) both}
.play .row:nth-child(2){animation-delay:150ms}
.play .row:nth-child(3){animation-delay:180ms}
.play .row:nth-child(4){animation-delay:210ms}
.play .keys{animation:fade-in var(--duration-slow) var(--ease-enter) 260ms both}
</style></head><body>
<div class="stage" id="stage">
<div class="field"><svg class="glyph" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><span><span class="caret"></span>Search apps, files, settings and the web</span></div>
<div class="recent"><div class="label">Recent</div>
<div class="row"><svg class="glyph" viewBox="0 0 16 16"><path d="M2.5 4.5h4l1.5 1.5h5.5v6.5h-11z"/></svg><span class="name">D:\Projects\LawnMowing</span><span class="meta">Folder</span></div>
<div class="row"><svg class="glyph" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="m5 7 2 1.5L5 10M8.5 10.5H11"/></svg><span class="name">Windows Terminal</span><span class="meta">App</span></div>
<div class="row"><svg class="glyph" viewBox="0 0 16 16"><path d="M4 2.5h5.5L12 5v8.5H4z"/><path d="M9.5 2.5V5H12"/></svg><span class="name">contract-economy.md</span><span class="meta">2 hours ago</span></div>
</div>
<div class="keys"><span class="hint"><kbd>Alt+Space</kbd> Search anywhere</span><span class="hint"><kbd>Win+E</kbd> Files</span><span class="hint"><kbd>Win+N</kbd> Notifications</span></div>
</div>
<div class="controls"><button class="ghost" id="replayButton">Replay</button></div>
<script>
function restartAnimation(element, className)
{
  element.classList.remove(className);
  void element.offsetWidth;
  element.classList.add(className);
}
const stage = document.getElementById('stage');
document.getElementById('replayButton').addEventListener('click', () => restartAnimation(stage, 'play'));
restartAnimation(stage, 'play');
</script>
</body></html>
