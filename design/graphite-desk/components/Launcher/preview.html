<style>
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 40%,var(--backdrop-glow),var(--backdrop) 70%);font-family:var(--font-sans);color:var(--ink);box-sizing:border-box;overflow:hidden}

.strip{display:flex;align-items:center;gap:var(--space-2);height:var(--strip-height);padding:0 var(--space-10);background:var(--header);border-bottom:1px solid var(--line);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-muted);box-sizing:border-box}

@keyframes rise-in{from{opacity:0;transform:translateY(var(--rise)) scale(var(--scale-from))}to{opacity:1;transform:none}}

body{background:radial-gradient(ellipse at 50% 30%,var(--backdrop-glow),var(--backdrop) 70%)}

.row{display:grid;grid-template-columns:16px 56px 20px minmax(0,1fr) auto auto 52px;align-items:center;column-gap:var(--space-3);height:var(--row-comfy);padding:0 var(--space-4);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;transition:background var(--duration-instant) var(--ease-standard)}

.row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}

mark{background:none;color:var(--ink);font-weight:600}

.user{display:flex;align-items:center;gap:var(--space-2);font-size:12px;font-weight:500}

@keyframes open-flash{0%{background:var(--accent-soft)}40%{background:var(--surface-300)}100%{background:var(--accent-soft)}}

<script>
function restartAnimation(element, className)
{
  element.classList.remove(className);
  void element.offsetWidth;
  element.classList.add(className);
}
const iconPaths = {"search": "<path d=\"M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.5 10.5l3 3\"/>", "folder": "<path d=\"M2.5 4.5h4l1.5 1.5h5.5v6.5h-11z\"/>", "file": "<path d=\"M4 2.5h5.5L12 5v8.5H4z\"/><path d=\"M9.5 2.5V5H12\"/>", "app": "<rect x=\"2.5\" y=\"2.5\" width=\"4.5\" height=\"4.5\" rx=\"1\"/><rect x=\"9\" y=\"2.5\" width=\"4.5\" height=\"4.5\" rx=\"1\"/><rect x=\"2.5\" y=\"9\" width=\"4.5\" height=\"4.5\" rx=\"1\"/><rect x=\"9\" y=\"9\" width=\"4.5\" height=\"4.5\" rx=\"1\"/>", "command": "<path d=\"m4 5.5 3 2.5-3 2.5M8.5 11H12\"/>", "settings": "<circle cx=\"8\" cy=\"8\" r=\"2\"/><path d=\"M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M3.8 3.8l1 1M11.2 11.2l1 1M3.8 12.2l1-1M11.2 4.8l1-1\"/>", "lock": "<rect x=\"3.5\" y=\"7\" width=\"9\" height=\"6.5\" rx=\"1.5\"/><path d=\"M5.5 7V5.5a2.5 2.5 0 0 1 5 0V7\"/>", "signout": "<path d=\"M9.5 3H4v10h5.5M7 8h6.5M11 5.5 13.5 8 11 10.5\"/>", "sleep": "<path d=\"M12.5 9.5A5 5 0 0 1 6.5 3.5a5 5 0 1 0 6 6z\"/>", "restart": "<path d=\"M3 8a5 5 0 1 0 1.5-3.5M3 2.5v2.5h2.5\"/>", "power": "<path d=\"M8 2.5V8M5 4.5a5 5 0 1 0 6 0\"/>", "chevron": "<path d=\"m5 6.5 3 3 3-3\"/>", "enter": "<path d=\"M12.5 4v4.5H4M6.5 6 4 8.5 6.5 11\"/>", "pin": "<path d=\"M6 2.5h4l-.5 4 2 2v1H4.5v-1l2-2zM8 9.5V14\"/>", "clock": "<circle cx=\"8\" cy=\"8\" r=\"5.5\"/><path d=\"M8 5v3l2 1.5\"/>", "status-idle": "<circle cx=\"8\" cy=\"8\" r=\"5\" stroke-dasharray=\"2 2\"/>", "status-running": "<circle cx=\"8\" cy=\"8\" r=\"5\"/><circle cx=\"8\" cy=\"8\" r=\"2.2\" fill=\"currentColor\" stroke=\"none\"/>", "moon": "<path d=\"M12.5 9.5A5 5 0 0 1 6.5 3.5a5 5 0 1 0 6 6z\"/>", "trash": "<path d=\"M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9\"/>", "display": "<rect x=\"2\" y=\"3\" width=\"12\" height=\"8\" rx=\"1.5\"/><path d=\"M6 13.5h4M8 11v2.5\"/>"};
const icon = (name, extraClass = '') => `<svg class="i ${extraClass}" viewBox="0 0 16 16">${iconPaths[name]}</svg>`;
const key = (label) => `<span class="key">${label}</span>`;

const tagColours = { Dev: 'var(--tag-blue)', Media: 'var(--tag-green)', Games: 'var(--tag-violet)', Social: 'var(--tag-rose)', System: 'var(--tag-teal)' };
const apps = [
  { name: 'gamebridge', alias: 'GB', tag: 'Games', pinned: true, running: false },
  { name: 'Claude', alias: 'CL', tag: 'Dev', pinned: true, running: true, recent: '2m' },
  { name: 'Prime Video', alias: 'PV', tag: 'Media', pinned: true, running: false },
  { name: 'Tabby Terminal', alias: 'TT', tag: 'Dev', pinned: true, running: true, recent: '8m' },
  { name: 'Steam', alias: 'ST', tag: 'Games', pinned: true, running: false },
  { name: 'Discord', alias: 'DC', tag: 'Social', pinned: true, running: true, recent: '1h' },
  { name: 'Apple TV', alias: 'TV', tag: 'Media', pinned: true, running: false },
  { name: 'crumbtree', alias: 'CT', tag: 'Dev', pinned: true, running: false },
  { name: 'Cookie DevHub', alias: 'CDH', tag: 'Dev', pinned: true, running: false },
  { name: 'Spotify', alias: 'SP', tag: 'Media', pinned: false, running: true, recent: '3h' },
  { name: 'WhatsApp', alias: 'WA', tag: 'Social', pinned: false, running: false, recent: '5h' },
  { name: 'Unity Hub', alias: 'UH', tag: 'Dev', pinned: false, running: false, recent: 'Yesterday' }
];
const places = [
  { name: 'AppData', alias: 'AD', path: '%APPDATA%' },
  { name: 'Local', alias: 'LO', path: '%LOCALAPPDATA%' },
  { name: 'Temp', alias: 'TMP', path: '%TEMP%' },
  { name: 'Home', alias: 'HM', path: 'C:\\Users\\cooki' },
  { name: 'Downloads', alias: 'DL', path: 'C:\\Users\\cooki\\Downloads' }
];
const files = [
  { name: 'contract-economy.md', alias: 'LMS-142', path: 'D:\\Projects\\LawnMowing', recent: '14m' },
  { name: 'ContractGenerationService.cs', alias: 'LMS-138', path: 'D:\\Projects\\LawnMowing\\Runtime', recent: '1h' },
  { name: 'claude-design-notes.md', alias: 'GD-12', path: 'Documents\\Graphite Desk', recent: '2h' },
  { name: 'GraphiteShell.ahk', alias: 'GD-9', path: 'Documents\\Scripts', recent: 'Yesterday' }
];
const commands = [
  { name: 'Toggle dark mode', alias: 'dark', glyph: 'moon', keys: ['Alt', 'D'] },
  { name: 'Display settings', alias: 'disp', glyph: 'display', keys: [] },
  { name: 'Empty Recycle Bin', alias: 'bin', glyph: 'trash', keys: [] },
  { name: 'Lock', alias: 'lock', glyph: 'lock', keys: ['Win', 'L'] },
  { name: 'Restart', alias: 'reboot', glyph: 'restart', keys: [] },
  { name: 'Shut down', alias: 'off', glyph: 'power', keys: [] }
];
const scopes = ['All', 'Apps', 'Files', 'Folders', 'Commands'];
const maximumRowsPerGroup = 4;

const root = document.getElementById('root');
const launcher = document.getElementById('launcher');
const queryInput = document.getElementById('query');
const bodyElement = document.getElementById('body');
let activeScope = 'All';
let selectedIndex = 0;
let visibleRows = [];

function escapeHtml(text)
{
  return text.replace(/[&<>"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character]);
}

function highlightMatch(text, query)
{
  const matchIndex = text.toLowerCase().indexOf(query.toLowerCase());
  if (!query || matchIndex < 0)
  {
    return escapeHtml(text);
  }
  return escapeHtml(text.slice(0, matchIndex)) + '<mark>' + escapeHtml(text.slice(matchIndex, matchIndex + query.length)) + '</mark>' + escapeHtml(text.slice(matchIndex + query.length));
}

function appMini(app)
{
  return `<span class="mini">${app.name[0].toUpperCase()}</span>`;
}

function statusMarkup(isRunning)
{
  return isRunning ? `<span class="status on">${icon('status-running')}Running</span>` : `<span class="status">${icon('status-idle')}</span>`;
}

function tagMarkup(tagName)
{
  return `<span class="tag" style="--dot:${tagColours[tagName]}">${tagName}</span>`;
}

function buildRow(kind, item, query, cells)
{
  return { kind, item, html: `<span class="kind">${icon(kind === 'Apps' ? 'app' : kind === 'Files' ? 'file' : kind === 'Folders' ? 'folder' : 'command')}</span><span class="id">${highlightMatch(item.alias, query)}</span>${cells.mini}<span class="name">${highlightMatch(item.name, query)}${cells.path ? `<span class="path">${escapeHtml(cells.path)}</span>` : ''}</span>${cells.middle || '<span></span>'}${cells.right || '<span></span>'}<span class="meta">${cells.meta || ''}</span>` };
}

function scoreItem(item, query)
{
  const lowerQuery = query.toLowerCase();
  if (item.alias.toLowerCase() === lowerQuery)
  {
    return 3;
  }
  if (item.name.toLowerCase().startsWith(lowerQuery) || item.alias.toLowerCase().startsWith(lowerQuery))
  {
    return 2;
  }
  return item.name.toLowerCase().includes(lowerQuery) ? 1 : 0;
}

function collectGroups(query)
{
  const groups = [
    { kind: 'Apps', items: apps, cells: (app) => ({ mini: appMini(app), middle: tagMarkup(app.tag), right: statusMarkup(app.running), meta: app.recent || '' }) },
    { kind: 'Files', items: files, cells: (file) => ({ mini: `<span class="mini">${icon('file')}</span>`, path: file.path, meta: file.recent }) },
    { kind: 'Folders', items: places, cells: (place) => ({ mini: `<span class="mini">${icon('folder')}</span>`, path: place.path }) },
    { kind: 'Commands', items: commands, cells: (command) => ({ mini: `<span class="mini">${icon(command.glyph)}</span>`, right: command.keys.length ? `<span class="keys">${command.keys.map(key).join('')}</span>` : '' }) }
  ];
  return groups
    .filter((group) => activeScope === 'All' || activeScope === group.kind)
    .map((group) =>
    {
      const matches = group.items
        .map((item) => ({ item, score: scoreItem(item, query) }))
        .filter((match) => match.score > 0)
        .sort((first, second) => second.score - first.score)
        .slice(0, activeScope === 'All' ? maximumRowsPerGroup : 12);
      return { kind: group.kind, total: group.items.filter((item) => scoreItem(item, query) > 0).length, rows: matches.map((match) => buildRow(group.kind, match.item, query, group.cells(match.item))) };
    })
    .filter((group) => group.rows.length > 0);
}

function renderScopes(groupCounts)
{
  document.getElementById('scopes').innerHTML = scopes.map((scope) =>
    `<button class="scope" data-scope="${scope}" aria-pressed="${scope === activeScope}">${scope}${groupCounts && scope !== 'All' ? `<span class="count">${groupCounts[scope] || 0}</span>` : ''}</button>`).join('');
  document.querySelectorAll('.scope').forEach((button) => button.addEventListener('click', () => { activeScope = button.dataset.scope; selectedIndex = 0; render(); queryInput.focus(); }));
}

function renderIdle()
{
  renderScopes(null);
  const pinnedApps = apps.filter((app) => app.pinned);
  const recentApps = apps.filter((app) => app.recent).slice(0, 4);
  bodyElement.innerHTML =
    `<div class="section">Places<span class="spacer"></span>${key('Alt')}<span>+ number</span></div>
    <div class="places">${places.map((place, placeIndex) => `<span class="place">${icon('folder')}${place.name}${key(placeIndex + 1)}</span>`).join('')}</div>
    <div class="section">Pinned<span class="count">${pinnedApps.length}</span></div>
    <div class="grid">${pinnedApps.map((app) => `<div class="tile"><span class="alias">${app.alias}</span><span class="app-icon">${app.name[0].toUpperCase()}</span>${app.running ? `<span class="run">${icon('status-running')}</span>` : ''}<span class="name">${escapeHtml(app.name)}</span></div>`).join('')}</div>
    <div class="section">Recent</div>
    <div class="results">${recentApps.map((app, rowIndex) => `<div class="row" style="animation-delay:${rowIndex * 30}ms">${buildRow('Apps', app, '', { mini: appMini(app), middle: tagMarkup(app.tag), right: statusMarkup(app.running), meta: app.recent }).html}</div>`).join('')}</div>`;
  visibleRows = [];
  setHints(false);
}

function renderResults(query)
{
  const allGroups = (() => { const previousScope = activeScope; activeScope = 'All'; const result = collectGroups(query); activeScope = previousScope; return result; })();
  const groupCounts = Object.fromEntries(allGroups.map((group) => [group.kind, group.total]));
  renderScopes(groupCounts);
  const groups = collectGroups(query);
  visibleRows = groups.flatMap((group) => group.rows);
  selectedIndex = Math.min(selectedIndex, Math.max(visibleRows.length - 1, 0));
  if (visibleRows.length === 0)
  {
    bodyElement.innerHTML = `<div class="empty-state">Nothing matches "${escapeHtml(query)}". ${key('Enter')} searches the web.</div>`;
    setHints(true);
    return;
  }
  let rowIndex = 0;
  bodyElement.innerHTML = '<div class="results">' + groups.map((group) =>
    `<div class="section">${group.kind}<span class="count">${group.total}</span></div>` +
    group.rows.map((row) => { const index = rowIndex++; return `<div class="row${index === selectedIndex ? ' sel' : ''}" data-index="${index}" style="animation-delay:${index * 20}ms">${row.html}</div>`; }).join('')
  ).join('') + '</div>';
  bodyElement.querySelectorAll('.row').forEach((rowElement) => rowElement.addEventListener('click', () => { selectedIndex = Number(rowElement.dataset.index); openSelected(); }));
  setHints(true);
}

function setHints(isSearching, message)
{
  const hints = document.getElementById('hints');
  if (message)
  {
    hints.innerHTML = `<span>${message}</span>`;
    return;
  }
  hints.innerHTML = isSearching
    ? `<span>${key('&uarr;')}${key('&darr;')} Move</span><span>${key('Enter')} Open</span><span>${key('Tab')} Scope</span><span>${key('Ctrl')}${key('Enter')} Run as admin</span>`
    : `<span>Type an alias like ${key('CL')} to jump</span><span>${key('Tab')} Scope</span>`;
}

function render()
{
  const query = queryInput.value.trim();
  if (query)
  {
    renderResults(query);
  }
  else
  {
    renderIdle();
  }
}

function moveSelection(step)
{
  if (visibleRows.length === 0)
  {
    return;
  }
  selectedIndex = (selectedIndex + step + visibleRows.length) % visibleRows.length;
  bodyElement.querySelectorAll('.row').forEach((rowElement) => rowElement.classList.toggle('sel', Number(rowElement.dataset.index) === selectedIndex));
}

function openSelected()
{
  const selectedRow = visibleRows[selectedIndex];
  const rowElement = bodyElement.querySelector(`.row[data-index="${selectedIndex}"]`);
  if (!selectedRow || !rowElement)
  {
    return;
  }
  restartAnimation(rowElement, 'flash');
  setHints(true, `Opening ${escapeHtml(selectedRow.item.name)}`);
  setTimeout(() => setHints(Boolean(queryInput.value.trim())), 1400);
}

queryInput.addEventListener('input', () => { selectedIndex = 0; render(); });
queryInput.addEventListener('keydown', (event) =>
{
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp')
  {
    event.preventDefault();
    moveSelection(event.key === 'ArrowDown' ? 1 : -1);
  }
  else if (event.key === 'Enter')
  {
    openSelected();
  }
  else if (event.key === 'Tab')
  {
    event.preventDefault();
    activeScope = scopes[(scopes.indexOf(activeScope) + (event.shiftKey ? scopes.length - 1 : 1)) % scopes.length];
    selectedIndex = 0;
    render();
  }
  else if (event.key === 'Escape')
  {
    queryInput.value = '';
    render();
  }
});
document.addEventListener('keydown', (event) => launcher.classList.toggle('alt-held', event.altKey));
document.addEventListener('keyup', (event) => launcher.classList.toggle('alt-held', event.altKey));

// Destructive power actions need a second press within three seconds, so a stray click never restarts the machine.
const powerActions = [
  { name: 'Lock', glyph: 'lock', keys: ['Win', 'L'], needsConfirm: false },
  { name: 'Sign out', glyph: 'signout', keys: [], needsConfirm: true },
  { name: 'Sleep', glyph: 'sleep', keys: [], needsConfirm: false },
  { name: 'Restart', glyph: 'restart', keys: [], needsConfirm: true },
  { name: 'Shut down', glyph: 'power', keys: [], needsConfirm: true }
];
const confirmWindowMilliseconds = 3000;
const powerElement = document.getElementById('power');
powerElement.innerHTML = powerActions.map((action, actionIndex) =>
  `<button data-index="${actionIndex}" aria-label="${action.name}">${icon(action.glyph)}<span class="label">Press again to ${action.name.toLowerCase()}</span><span class="tooltip">${action.name}${action.keys.length ? `<span class="keys">${action.keys.map(key).join('')}</span>` : ''}</span></button>`).join('');
powerElement.querySelectorAll('button').forEach((button) =>
{
  let confirmTimer = null;
  button.addEventListener('click', () =>
  {
    const action = powerActions[Number(button.dataset.index)];
    if (action.needsConfirm && !button.classList.contains('confirming'))
    {
      button.classList.add('confirming');
      confirmTimer = setTimeout(() => button.classList.remove('confirming'), confirmWindowMilliseconds);
      return;
    }
    clearTimeout(confirmTimer);
    button.classList.remove('confirming');
    setHints(false, `${action.name} (preview only)`);
    setTimeout(() => render(), 1400);
  });
});

function typeDemo()
{
  queryInput.value = '';
  render();
  queryInput.focus();
  const demoText = 'cl';
  [...demoText].forEach((character, characterIndex) => setTimeout(() =>
  {
    queryInput.value += character;
    selectedIndex = 0;
    render();
  }, 180 * (characterIndex + 1)));
}

document.getElementById('replayButton').addEventListener('click', () => { queryInput.value = ''; render(); restartAnimation(root, 'play'); queryInput.focus(); });
document.getElementById('demoButton').addEventListener('click', typeDemo);
render();
queryInput.focus();
</script>
