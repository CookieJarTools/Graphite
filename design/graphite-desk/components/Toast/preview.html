<!-- @dsCard group="Shell" height=320 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Toast</title>
<style>
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 40%,var(--backdrop-glow),var(--backdrop) 70%);font-family:var(--font-sans);color:var(--ink);box-sizing:border-box;overflow:hidden}
.card{background:linear-gradient(180deg,var(--surface-200),var(--surface-100));border:1px solid var(--glass-edge);border-radius:var(--radius-md);box-shadow:var(--shadow-card),inset 0 1px 0 var(--glass-sheen);overflow:hidden;color:var(--ink)}
.strip{display:flex;align-items:center;gap:var(--space-2);height:var(--strip-height);padding:0 var(--space-10);background:var(--header);border-bottom:1px solid var(--line);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-muted);box-sizing:border-box}
.strip .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glyph{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ghost{font:inherit;font-size:13px;line-height:18px;font-weight:500;color:var(--ink);background:none;border:0;border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);cursor:pointer;transition:background var(--duration-instant) var(--ease-standard)}
.ghost:hover,.ghost.hover{background:var(--surface-300)}
.hint{font-size:11px;line-height:14px;color:var(--ink-muted);display:flex;align-items:center;gap:var(--space-1)}
kbd{font-family:var(--font-sans);font-size:11px;color:var(--ink-muted)}
.controls{position:fixed;left:var(--space-2);bottom:var(--space-2);display:flex;gap:var(--space-1);z-index:50}
.controls .ghost{font-size:12px;padding:6px var(--space-3);background:var(--surface-200);border:1px solid var(--glass-edge)}
.controls .ghost:hover{background:var(--surface-300)}
@keyframes rise-in{from{opacity:0;transform:translateY(var(--rise)) scale(var(--scale-from))}to{opacity:1;transform:none}}
@keyframes rise-out{from{opacity:1;transform:none}to{opacity:0;transform:scale(0.98)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@keyframes row-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
body{padding:var(--space-4)}
.stack{position:absolute;top:var(--space-4);right:var(--space-4);left:var(--space-4);display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2)}
.card{width:100%;max-width:var(--toast-width);flex:none}
.strip{height:32px;padding:0 var(--space-4)}
.time{font-size:11px;line-height:14px;font-weight:400}
.dismiss{background:none;border:0;padding:0;color:var(--ink-muted);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity var(--duration-instant) var(--ease-standard)}
.card:hover .dismiss{opacity:1}
.body{padding:var(--space-3) var(--space-4) 0}
.t{margin:0;font-size:14px;line-height:22px;font-weight:600;display:flex;align-items:center;gap:var(--space-2)}
.d{margin:0;font-size:14px;line-height:22px;color:var(--ink-muted)}
.actions{display:flex;gap:var(--space-1);padding:var(--space-2) 0 var(--space-2)}
.bad{color:var(--danger)}
.card.arriving{animation:toast-in var(--duration-slow) var(--ease-enter) both}
.card.leaving{animation:toast-out var(--duration-fast) var(--ease-exit) both}
@keyframes toast-in{from{opacity:0;transform:translateX(var(--slide))}to{opacity:1;transform:none}}
@keyframes toast-out{from{opacity:1;transform:none}to{opacity:0;transform:translateX(var(--slide))}}
</style></head><body>
<div class="stack" id="toastStack"></div>
<template id="calendarToast"><div class="card">
<div class="strip"><svg class="glyph" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10.5" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v2M10.5 2v2"/></svg><span class="title">Calendar</span><span class="time">now</span><button class="dismiss" aria-label="Dismiss"><svg class="glyph" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></svg></button></div>
<div class="body"><p class="t">Standup in 5 minutes</p><p class="d">Skyhook daily, 10:00 to 10:15</p></div>
<div class="actions"><button class="ghost">Join</button><button class="ghost dismiss-action">Snooze</button></div>
</div></template>
<template id="buildToast"><div class="card">
<div class="strip"><svg class="glyph" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="m5 7 2 1.5L5 10M8.5 10.5H11"/></svg><span class="title">Terminal</span><span class="time">now</span><button class="dismiss" aria-label="Dismiss"><svg class="glyph" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></svg></button></div>
<div class="body"><p class="t"><span class="bad"><svg class="glyph" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h0"/></svg></span>Build failed</p><p class="d">3 errors in ContractGenerationService.cs</p></div>
<div class="actions"><button class="ghost dismiss-action">Open log</button></div>
</div></template>
<div class="controls"><button class="ghost" id="sendButton">Send toast</button></div>
<script>
function restartAnimation(element, className)
{
  element.classList.remove(className);
  void element.offsetWidth;
  element.classList.add(className);
}
const toastStack = document.getElementById('toastStack');
const toastTemplates = [document.getElementById('calendarToast'), document.getElementById('buildToast')];
const maximumVisibleToasts = 3;
const autoDismissMilliseconds = 6000;
let nextTemplateIndex = 0;

// FLIP: record positions, change the DOM, then animate each survivor from its old spot so the stack eases instead of jumping.
function animateStackReflow(changeStack)
{
  const toasts = [...toastStack.children];
  const previousTops = new Map(toasts.map((toast) => [toast, toast.getBoundingClientRect().top]));
  changeStack();
  for (const toast of toastStack.children)
  {
    if (!previousTops.has(toast) || toast.classList.contains('leaving'))
    {
      continue;
    }
    const offset = previousTops.get(toast) - toast.getBoundingClientRect().top;
    if (offset !== 0)
    {
      toast.animate([{ transform: `translateY(${offset}px)` }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(0.2, 0, 0, 1)' });
    }
  }
}

function dismissToast(toast)
{
  if (toast.classList.contains('leaving'))
  {
    return;
  }
  toast.classList.remove('arriving');
  toast.classList.add('leaving');
  toast.addEventListener('animationend', () => animateStackReflow(() => toast.remove()), { once: true });
}

function sendToast()
{
  const template = toastTemplates[nextTemplateIndex % toastTemplates.length];
  nextTemplateIndex += 1;
  const toast = template.content.firstElementChild.cloneNode(true);
  toast.classList.add('arriving');
  toast.querySelectorAll('.dismiss, .dismiss-action').forEach((button) => button.addEventListener('click', () => dismissToast(toast)));
  animateStackReflow(() => toastStack.prepend(toast));
  const activeToasts = [...toastStack.children].filter((item) => !item.classList.contains('leaving'));
  activeToasts.slice(maximumVisibleToasts).forEach(dismissToast);
  let dismissTimer = setTimeout(() => dismissToast(toast), autoDismissMilliseconds);
  toast.addEventListener('mouseenter', () => clearTimeout(dismissTimer));
  toast.addEventListener('mouseleave', () => { dismissTimer = setTimeout(() => dismissToast(toast), autoDismissMilliseconds); });
}

document.getElementById('sendButton').addEventListener('click', sendToast);
sendToast();
setTimeout(sendToast, 500);
</script>
</body></html>
