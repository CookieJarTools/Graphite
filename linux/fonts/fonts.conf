<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Graphite Desk's text, the MacType way: smooth outlines kept close to their design (slight
     hinting) with subpixel smoothing on LCD screens, and no blocky embedded bitmaps. The
     heavier, darker strokes come from FreeType's stem darkening, which hyprland.lua turns on
     (FREETYPE_PROPERTIES) unless Settings' "Smoother text" is off. linux/gtk/apply.sh links
     this to ~/.config/fontconfig/fonts.conf. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
