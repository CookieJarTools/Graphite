# Apps carry on when the computer runs out of memory and Linux ends one of their processes, as
# Graphite's launcher sets for the apps it starts (launch.sh): this is for the apps that make a
# place of their own in the system (Claude, Discord and other Electron apps, Flatpak apps), which
# closed whole, everything open in them lost. system/install.sh puts it in
# /etc/systemd/user.conf.d.
[Manager]
DefaultOOMPolicy=continue
