# Swap tuned for compressed swap in RAM (zram-generator.conf; system/install.sh puts this in
# /etc/sysctl.d), the values the Arch wiki gives for it: what's idle, as a browser's background
# tabs, goes there before the files in use are dropped from memory, which slowed everything
# to a crawl just before apps were closed.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
