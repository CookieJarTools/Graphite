# Vesper for kitty, Graphite's terminal: the body in the sidebar colour (#0B0C0E), JetBrains
# Mono at 13 px on 22 px lines, 16 px in at the top and bottom and 18 px at the sides, and the
# palette's colours for the 16 ANSI ones. linux/gtk/apply.sh includes this through
# ~/.config/kitty/graphite.conf, which then sets the accent chosen in the shell (directories,
# links, the selection).

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
# kitty sizes type in points: 9.75 pt is 13 px at 96 dpi. Its lines are then 18 px; 4 px more
# makes them 22 (modify_font adds to the height, it doesn't set it).
font_size        9.75
modify_font      cell_height 4px

# In points too: 12 pt is 16 px, 13.5 pt is 18 px.
window_padding_width 12 13.5

initial_window_width  680
initial_window_height 420

# A block cursor, blinking on and off (not fading) every 1.1 s.
cursor_shape          block
cursor_blink_interval 0.55 step-end

foreground           #c9ccd3
background           #0b0c0e
cursor               #c9ccd3
cursor_text_color    #0b0c0e
selection_foreground #edeef0
selection_background #262a52
url_color            #9aa2ff

# Black and grey: the raised surface, and the faint text colour for what's quiet (comments,
# suggestions).
color0  #16171b
color8  #6e737d
# Red, green, yellow: danger, success, warning.
color1  #f08a8a
color9  #f5a3a3
color2  #6fd3a4
color10 #8be0b8
color3  #edb96b
color11 #f2cb8e
# Blue is the accent's text colour (directories, prompts that use blue); graphite.conf sets it.
color4  #9aa2ff
color12 #b4baff
color5  #c79bf2
color13 #d6b3f7
color6  #6cc7d9
color14 #8dd6e4
color7  #c9ccd3
color15 #edeef0

active_tab_foreground   #edeef0
active_tab_background   #16171b
inactive_tab_foreground #8a8f98
inactive_tab_background #0b0c0e
tab_bar_background      #0b0c0e
active_border_color     #6e79f2
inactive_border_color   #16171b
